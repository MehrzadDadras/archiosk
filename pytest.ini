[pytest]
addopts = -m "not legacy_route_diagnostic"

# CLAUDE-TEST-TIER0-01: no test may wait forever.
#
# Two full-suite stalls have been recorded (4h27m and 4h35m against a 26-27
# minute norm), and separately a single un-mocked ingest_upload once hung
# against a live API for 8.5 hours. In every case the run was UNBOUNDED: the
# only signal was wall-clock, and which test was stuck could not be named
# afterwards. This turns that into a named failure with a stack dump.
#
# 300s is a hang detector, not a performance budget. Measured, not guessed: the
# two heaviest tests in this repository are a real headless-Chromium geometry
# test (5.46s) and a four-process bridge-claim race (2.89s), so this leaves
# roughly 55x headroom over the slowest real test - enough that even a stalled
# run, where everything is ~10x slower, still would not trip it. Raise it only
# with a measurement, never to make a red test green.
#
# timeout_method is deliberately unset so pytest-timeout picks per platform
# (signal where available, which fails only the offending test; thread on
# Windows, which dumps every thread's stack and ends the run - on a genuine
# hang that dump is the point). Tier 0 overrides this with its own --timeout=30
# in tools/tier0.py; see TEST_LANES.md.
timeout = 300

markers =
    legacy_route_diagnostic: preserved diagnostics for removed Case collaboration route entry points
