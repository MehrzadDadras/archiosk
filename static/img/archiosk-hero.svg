<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 212" width="260" height="212" role="img" aria-label="Archiosk hero emblem">
  <title>Archiosk hero emblem</title>
  <!--
    CLAUDE-LANDING-HERO-01A. Hand-authored vector interpretation of the
    Product Owner's approved landing reference
    (C:\Archiosk\Samples\ARCHIOSK-landing-reference.png): a metallic,
    aerodynamic ribbed cone angled up and to the right, a large ring at
    its mouth, a hooked antenna carrying a small ring above it, an open
    tail loop, and motion trails behind the tip.

    This is an interpretation of a raster reference, not a trace of it.
    It is deliberately line art, which is what the reference itself is,
    and is self-contained (its own gradients and glow filter) so it can
    be used through <img> without inheriting any page styling.

    It is a NEW asset. It is not, and must not be confused with, the
    two-limb ARCHIOSK mark in templates/_macros.html::archiosk_mark or
    static/favicon.svg, which remain the product's own bottleneck mark.
  -->
  <defs>
    <!-- userSpaceOnUse for the same reason as the wordmark: several ribs
         are near-vertical, and one sheet of metal across the whole form
         is what the reference shows. -->
    <linearGradient id="ah-metal" gradientUnits="userSpaceOnUse" x1="40" y1="16" x2="205" y2="195">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#dfe7ef"/>
      <stop offset="42%" stop-color="#828e9c"/>
      <stop offset="57%" stop-color="#f6f9fc"/>
      <stop offset="78%" stop-color="#93a0ad"/>
      <stop offset="100%" stop-color="#e9eff5"/>
    </linearGradient>
    <linearGradient id="ah-trail" gradientUnits="userSpaceOnUse" x1="60" y1="160" x2="0" y2="205">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#dbe4ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9d4de" stop-opacity="0"/>
    </linearGradient>
    <filter id="ah-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Motion trails: behind everything, no glow, so they read as speed
       rather than as another lit object. -->
  <g fill="none" stroke="url(#ah-trail)" stroke-linecap="round">
    <path d="M46 168 C 26 175 10 186 0 195" stroke-width="3.4"/>
    <path d="M52 179 C 32 188 14 197 2 206" stroke-width="2.4"/>
    <path d="M41 160 C 23 163 9 169 0 176" stroke-width="1.8"/>
  </g>

  <g fill="none" stroke="url(#ah-metal)" stroke-linecap="round" stroke-linejoin="round" filter="url(#ah-glow)">
    <!-- Cone: upper and lower edges converging on the tip. -->
    <path d="M48 176 C 90 154 130 109 165 54" stroke-width="5"/>
    <path d="M48 176 C 90 172 140 149 172 106" stroke-width="5"/>

    <!-- Ribs across the taper, fanning open toward the mouth. -->
    <g stroke-width="2.4" opacity="0.95">
      <path d="M86 144 L 82 170"/>
      <path d="M102 132 L 100 162"/>
      <path d="M117 120 L 117 154"/>
      <path d="M131 107 L 133 146"/>
      <path d="M144 94 L 148 137"/>
      <path d="M155 80 L 162 128"/>
      <path d="M163 66 L 172 117"/>
    </g>

    <!-- The mouth ring, and its inner highlight. -->
    <circle cx="188" cy="78" r="30" stroke-width="6"/>
    <circle cx="188" cy="78" r="21" stroke-width="1.8" opacity="0.55"/>

    <!-- Hooked antenna sweeping over the mouth, with its small ring. -->
    <path d="M165 54 C 180 30 210 24 224 38 C 232 46 230 60 220 64" stroke-width="4.2"/>
    <circle cx="216" cy="30" r="6" stroke-width="3.2"/>
    <path d="M216 36 C 210 48 198 48 192 44" stroke-width="2.6" opacity="0.9"/>

    <!-- Open tail loop at the tip. -->
    <path d="M48 176 C 28 180 24 200 42 200 C 58 200 62 184 54 176" stroke-width="3.6"/>
  </g>
</svg>
