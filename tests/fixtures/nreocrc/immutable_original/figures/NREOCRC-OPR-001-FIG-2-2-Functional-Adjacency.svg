<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">FIGURE OPR-2.2 — FUNCTIONAL RELATIONSHIP / ADJACENCY DIAGRAM</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#555">NREOCRC — Schematic Only — Not to Scale</text>

  <!-- Nodes -->
  <circle cx="180" cy="150" r="70" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c763d">PUBLIC /</text>
  <text x="180" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c763d">COMMUNITY</text>

  <circle cx="450" cy="120" r="70" fill="#fcf8e3" stroke="#8a6d3b" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3b">MUNICIPAL</text>
  <text x="450" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3b">ADMINISTRATION</text>

  <circle cx="720" cy="180" r="80" fill="#f2dede" stroke="#a94442" stroke-width="2"/>
  <text x="720" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#a94442">EMERGENCY</text>
  <text x="720" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#a94442">OPERATIONS</text>
  <text x="720" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#a94442">CENTRE (EOC)</text>

  <circle cx="720" cy="420" r="70" fill="#e8d5e8" stroke="#6b2d6b" stroke-width="2"/>
  <text x="720" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b2d6b">COMMUNICATIONS /</text>
  <text x="720" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b2d6b">DISPATCH-ADJACENT</text>

  <circle cx="450" cy="480" r="70" fill="#d9edf7" stroke="#31708f" stroke-width="2"/>
  <text x="450" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#31708f">VEHICLE /</text>
  <text x="450" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#31708f">SERVICE</text>

  <circle cx="180" cy="450" r="70" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <text x="180" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">SUPPORT /</text>
  <text x="180" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">BUILDING SERVICES</text>

  <!-- Relationships: solid = required direct adjacency, dashed = controlled/indirect, dotted = separated but linked by procedure -->
  <line x1="245" y1="175" x2="385" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="150" x2="650" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="720" y1="260" x2="720" y2="350" stroke="#333" stroke-width="3"/>
  <line x1="520" y1="440" x2="650" y2="400" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="250" y1="420" x2="380" y2="470" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="180" y1="220" x2="180" y2="380" stroke="#333" stroke-width="1.5" stroke-dasharray="2,6"/>
  <line x1="640" y1="240" x2="480" y2="440" stroke="#333" stroke-width="1.5" stroke-dasharray="2,6"/>

  <!-- Legend -->
  <rect x="60" y="555" width="780" height="70" fill="#f9f9f9" stroke="#ccc"/>
  <text x="70" y="573" font-size="11" font-weight="bold">LEGEND:</text>
  <line x1="70" y1="585" x2="110" y2="585" stroke="#333" stroke-width="2"/>
  <text x="118" y="589" font-size="10">Required direct adjacency (shared corridor or immediate proximity)</text>
  <line x1="70" y1="600" x2="110" y2="600" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="118" y="604" font-size="10">Controlled adjacency (separated by security transition point)</text>
  <line x1="70" y1="615" x2="110" y2="615" stroke="#333" stroke-width="1.5" stroke-dasharray="2,6"/>
  <text x="118" y="619" font-size="10">Indirect / procedural relationship only (no shared circulation required)</text>
</svg>
