# /etc/nginx/sites-available/archiosk.com
# Symlink into sites-enabled, then: nginx -t && systemctl reload nginx

upstream archiosk_app {
    # Passive health check: after 3 failed requests within 30s, nginx
    # marks this backend down for 30s and fails fast (502) instead of
    # hanging every request on it. There's only one backend here, so
    # this trades "always try anyway" for "fail fast during an outage" —
    # revert to fail_timeout=0 if you'd rather always attempt the request.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name archiosk.com www.archiosk.com;

    # Redirect all plain HTTP to HTTPS once certbot has issued certs.
    return 301 https://archiosk.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archiosk.com www.archiosk.com;

    ssl_certificate     /etc/letsencrypt/live/archiosk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archiosk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Keep in sync with MAX_UPLOAD_MB in .env — this is a static nginx
    # literal, not env-driven, so raising MAX_UPLOAD_MB without updating
    # this value means nginx will 413 uploads the app would otherwise
    # accept, well before Flask's own MAX_CONTENT_LENGTH check ever runs.
    client_max_body_size 60M;
    # A file near that limit can legitimately take a while to arrive over a
    # slow connection — give both legs of the upload the same headroom as
    # the classification response gets below, instead of nginx's 60s default.
    client_body_timeout 120s;

    access_log /var/log/nginx/archiosk.access.log;
    error_log  /var/log/nginx/archiosk.error.log;

    # Applies to /health and / below via nginx's normal add_header
    # inheritance. NOT inherited by location /static/, though — nginx only
    # inherits a parent's add_header directives when the child location
    # defines none of its own; /static/ already sets its own (the
    # Cache-Control below), which silently drops these unless repeated
    # there too. Repeated in /static/ for that reason, not by accident.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CLAUDE-CA1D-CSP-INLINE-SCRIPT-FIX-01: Content-Security-Policy used to
    # be set here, as a static value with no 'unsafe-inline'/nonce -- on
    # the (incorrect, as it turned out) assumption that this app has no
    # inline <script> content. It has many, load-bearing ones (per-page
    # wiring in base.html/gateway_shell.html/etc.), and nginx can't vary a
    # header per request, so that policy silently blocked every one of
    # them in production with no console error to reveal it (see
    # app.py's own get_csp_nonce() docstring for the incident). CSP now
    # lives in Flask (app.py's set_csp_header), which mints a fresh nonce
    # per request and can match it to that response's own script tags --
    # something a static nginx header structurally cannot do. Do not add
    # a Content-Security-Policy header back here; it would only reassert
    # the same bug.

    location /static/ {
        alias /var/www/archiosk/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # No Content-Security-Policy here either -- plain static assets
        # (.css/.js/etc.) never execute a policy of their own; only the
        # HTML documents Flask serves need one, and Flask now owns it.
    }

    # Fast, quiet path for external monitors (uptime checks, systemd
    # timers) — kept out of the access log and given tight timeouts so a
    # stuck backend is reported quickly rather than after the full
    # request timeout. Counts toward the upstream's passive max_fails.
    location = /health {
        access_log off;
        proxy_pass http://archiosk_app;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        proxy_pass http://archiosk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Keep in sync with GUNICORN_TIMEOUT in deploy/gunicorn.conf.py —
        # a large document's classify + consistency-check stages can
        # legitimately take up to ANTHROPIC_CLASSIFY_BUDGET_SECONDS plus
        # ANTHROPIC_CONSISTENCY_TIMEOUT_SECONDS combined, and nginx's 60s
        # default would otherwise cut the response off before Gunicorn does.
        proxy_read_timeout 150s;
        # Forwarding a large, slow upload to Gunicorn is the same
        # concern as client_body_timeout above, just on the upstream leg.
        proxy_send_timeout 120s;
    }
}
