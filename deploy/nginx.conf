# The intended ARCHIOSK production topology.
#
# CLAUDE-WP-RETIREMENT-01: on the current host this is deployed as
# /etc/nginx/sites-available/default (not ...-available/archiosk.com), because
# that is the file certbot attached its TLS directives to. The two `# managed
# by Certbot` blocks - ssl_certificate, ssl_certificate_key, the
# options-ssl-nginx include, ssl_dhparam, and the port-80 redirect server -
# stay SERVER-MANAGED and are deliberately not reproduced verbatim here: they
# name machine-specific certificate paths that certbot rewrites on renewal, and
# a repository copy would go stale the first time it renews. Everything else
# below is authoritative and should match production.
#
# RECONCILED WITH LIVE 2026-08-29 (CLAUDE-NGINX-RECONCILE-01), and what that
# does and does not mean:
#
# This file is NOT, and is not meant to become, a byte-for-byte copy of
# /etc/nginx/sites-enabled/default. The header above states why - the certbot
# blocks are server-managed and would go stale on renewal - so `diff` against
# live will always show differences, and that is by design rather than drift.
#
# What WAS reconciled, because these were real divergences:
#   - the upstream name. This file said `archiosk_app`; production has said
#     `archiosk_go`. Installing this copy verbatim would have failed on an
#     undefined upstream. Live won: it is what serves traffic.
#   - the gzip configuration added on 2026-08-29, in /static/ and in the
#     drawing-sheet location, neither of which existed here.
#
# What was deliberately NOT copied down from live: the certbot-managed TLS
# directives and the port-80 redirect server, per the paragraph above.
#
# Location ORDER also differs between the two (live lists /health before
# /static/). That is cosmetic - nginx resolves prefix locations by longest
# match and `= /health` is an exact match that wins outright - so it was left
# alone rather than churned to make a diff look tidier.
#
# Install: nginx -t && systemctl reload nginx
#
# This host serves ARCHIOSK and nothing else. It ran a WordPress co-tenant at
# /wp/ until 2026-08-23; that was retired (410, php8.1-fpm and mariadb stopped
# and disabled, filesystem and database archived to
# /var/archiosk-retired/wordpress-2026-08-23/). The request path is
# browser -> nginx -> gunicorn -> Flask, with no CMS anywhere in it.

upstream archiosk_go {
    # Passive health check: after 3 failed requests within 30s, nginx
    # marks this backend down for 30s and fails fast (502) instead of
    # hanging every request on it. There's only one backend here, so
    # this trades "always try anyway" for "fail fast during an outage" —
    # revert to fail_timeout=0 if you'd rather always attempt the request.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name archiosk.com www.archiosk.com;

    # Redirect all plain HTTP to HTTPS once certbot has issued certs.
    return 301 https://archiosk.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archiosk.com www.archiosk.com;

    ssl_certificate     /etc/letsencrypt/live/archiosk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archiosk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Keep in sync with MAX_UPLOAD_MB in .env — this is a static nginx
    # literal, not env-driven, so raising MAX_UPLOAD_MB without updating
    # this value means nginx will 413 uploads the app would otherwise
    # accept, well before Flask's own MAX_CONTENT_LENGTH check ever runs.
    client_max_body_size 60M;
    # A file near that limit can legitimately take a while to arrive over a
    # slow connection — give both legs of the upload the same headroom as
    # the classification response gets below, instead of nginx's 60s default.
    client_body_timeout 120s;

    access_log /var/log/nginx/archiosk.access.log;
    error_log  /var/log/nginx/archiosk.error.log;

    # Applies to /health and / below via nginx's normal add_header
    # inheritance. NOT inherited by location /static/, though — nginx only
    # inherits a parent's add_header directives when the child location
    # defines none of its own; /static/ already sets its own (the
    # Cache-Control below), which silently drops these unless repeated
    # there too. Repeated in /static/ for that reason, not by accident.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CLAUDE-CA1D-CSP-INLINE-SCRIPT-FIX-01: Content-Security-Policy used to
    # be set here, as a static value with no 'unsafe-inline'/nonce -- on
    # the (incorrect, as it turned out) assumption that this app has no
    # inline <script> content. It has many, load-bearing ones (per-page
    # wiring in base.html/gateway_shell.html/etc.), and nginx can't vary a
    # header per request, so that policy silently blocked every one of
    # them in production with no console error to reveal it (see
    # app.py's own get_csp_nonce() docstring for the incident). CSP now
    # lives in Flask (app.py's set_csp_header), which mints a fresh nonce
    # per request and can match it to that response's own script tags --
    # something a static nginx header structurally cannot do. Do not add
    # a Content-Security-Policy header back here; it would only reassert
    # the same bug.

    # CLAUDE-WP-RETIREMENT-01: the retired WordPress co-tenant. 410 Gone,
    # deliberately - the content existed and was withdrawn, which is what 410
    # means, and it is honest in a way that redirecting into ARCHIOSK would not
    # be. `^~` outranks the regex below, so /wp/anything.php is answered here
    # rather than reaching a PHP handler.
    location ^~ /wp/ {
        access_log off;
        return 410;
    }

    # Nothing on this host serves PHP. Belt and braces alongside php8.1-fpm
    # being stopped and disabled: if the service is ever reinstalled, nginx
    # still will not route to it.
    location ~ \.php$ {
        access_log off;
        return 410;
    }

    location /static/ {
        alias /var/www/archiosk/static/;
        # CLAUDE-EYE-COMPARE-01: stock nginx mime.types (/etc/nginx/mime.types)
        # has no .mjs entry, so it fell through to nginx's own global
        # default_type (application/octet-stream) — browsers refuse to
        # execute a dynamically import()-ed ES module unless its response
        # Content-Type is a real JS MIME type, which is exactly what
        # produced the live PDF.js failure (Failed to fetch dynamically
        # imported module .../pdf.min.mjs — static/js/pdf_viewer.js and
        # static/js/eye_pane.js both dynamically import() vendored
        # pdf.min.mjs/pdf.worker.min.mjs). default_type here only takes
        # effect for extensions with no entry in the active types map —
        # every other extension under /static/ (.css/.js/.png/etc.)
        # already has a real mapping and is unaffected. Applied directly
        # on the live server's actual active config (currently
        # /etc/nginx/sites-available/default, not this file verbatim —
        # see that file's own drift from this one, a separate, pre-
        # existing discrepancy that stage did not attempt to reconcile --
        # now RESOLVED by CLAUDE-WP-RETIREMENT-01, which reconciled the
        # live config back into this file; see the header for the one
        # remaining, deliberate exception, certbot's own TLS directives).
        # (A `types { include mime.types; }` override was tried first and
        # rejected by `nginx -t` — /etc/nginx/mime.types already contains
        # its own top-level `types { ... }` wrapper, so nesting it inside
        # a second one is a syntax error, not a valid merge — default_type
        # alone is the correct, minimal fix.)
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # CLAUDE-SVG-GZIP-01. `gzip on` is set globally in nginx.conf, but
        # every other gzip directive there is commented out - so nginx's
        # DEFAULT gzip_types applied, which is text/html only. CSS, JS and SVG
        # under /static/ were served uncompressed. Measured after enabling:
        # main.css 418,004 -> 112,958 bytes (3.7x), case_workspace.js
        # 122,108 -> 30,966 (3.9x).
        #
        # gzip_vary is not optional here. This location sets
        # `Cache-Control: public, immutable`, so a shared cache may hold these
        # responses; without Vary: Accept-Encoding it could serve a gzipped
        # body to a client that never asked for one.
        gzip on;
        gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_vary on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # No Content-Security-Policy here either -- plain static assets
        # (.css/.js/etc.) never execute a policy of their own; only the
        # HTML documents Flask serves need one, and Flask now owns it.
    }

    # Fast, quiet path for external monitors (uptime checks, systemd
    # timers) — kept out of the access log and given tight timeouts so a
    # stuck backend is reported quickly rather than after the full
    # request timeout. Counts toward the upstream's passive max_fails.
    location = /health {
        access_log off;
        proxy_pass http://archiosk_go;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # CLAUDE-SVG-GZIP-01 - compression for DRAWING SHEETS ONLY.
    #
    # Project sheets are served by a Flask route rather than from /static/,
    # because each request is authorised individually (services/project_rbac.py
    # - a role check beside a world-readable directory stops nobody). So they
    # arrive through the proxy, where `gzip_proxied` being commented out in
    # nginx.conf left them uncompressed. Measured locally: 77.79 MB of SVG
    # across eleven sheets becomes 5.50 MB gzipped, 14.2x; A204 alone is
    # 9.36 MB -> 0.74 MB.
    #
    # WHY ITS OWN LOCATION rather than gzip_proxied on `location /`: this scopes
    # the change to drawings instead of widening it to every proxied response.
    #
    # Note, because a first version of this comment claimed otherwise:
    # application HTML IS already compressed and was before this change.
    # `gzip on` is global, nginx's default gzip_types is text/html, and
    # gzip_proxied only suppresses compression when the INCOMING request
    # carries a Via header - which a direct browser request does not. Nothing
    # here altered that. The relevant mitigation is that Flask-WTF randomises
    # the CSRF token on every response (verified live: three consecutive
    # fetches of /login returned three different tokens), which is the accepted
    # defence against BREACH on token-bearing pages.
    #
    # gzip_types is image/svg+xml only - PNG and PDF are already compressed.
    #
    # The proxy_set_header and add_header lines are repeated rather than
    # inherited: add_header does NOT inherit into a sibling location that
    # defines its own, so omitting them would silently drop HSTS and the other
    # security headers from every sheet response.
    location ~ ^/project/[^/]+/sheet/ {
        proxy_pass http://archiosk_go;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 150s;
        proxy_send_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        gzip on;
        gzip_proxied any;
        gzip_types image/svg+xml;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_vary on;
    }

    location / {
        proxy_pass http://archiosk_go;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Keep in sync with GUNICORN_TIMEOUT in deploy/gunicorn.conf.py —
        # a large document's classify + consistency-check stages can
        # legitimately take up to ANTHROPIC_CLASSIFY_BUDGET_SECONDS plus
        # ANTHROPIC_CONSISTENCY_TIMEOUT_SECONDS combined, and nginx's 60s
        # default would otherwise cut the response off before Gunicorn does.
        proxy_read_timeout 150s;
        # Forwarding a large, slow upload to Gunicorn is the same
        # concern as client_body_timeout above, just on the upstream leg.
        proxy_send_timeout 120s;
    }
}
