{% extends "gateway_base.html" %}

{% block gateway_title %}Forgot password &mdash; Archiosk{% endblock %}
{% block gateway_card_modifier %} gateway-card-compact{% endblock %}
{% block gateway_body %}
<form method="post">
    <div class="gateway-field">
        <label for="email">Account email</label>
        <input type="email" id="email" name="email" class="text-input" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary gateway-signin-button">Send reset link</button>
</form>
<p><a href="{{ url_for('portal.login') }}">Back to sign in</a></p>
{% endblock %}
