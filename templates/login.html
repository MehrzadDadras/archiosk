{% extends "gateway_base.html" %}

{% block gateway_title %}Sign in &mdash; Archiosk{% endblock %}
{% block gateway_card_modifier %} gateway-card-compact{% endblock %}
{% block gateway_body %}
<form method="post">
    <div class="gateway-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="text-input" required autofocus>
    </div>
    <div class="gateway-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="text-input" required>
    </div>
    {% if error %}
    <div class="mono form-error">{{ error }}</div>
    {% endif %}
    <button type="submit" class="btn btn-primary gateway-signin-button">Sign in</button>
</form>
<p><a href="{{ url_for('portal.forgot_password') }}">Forgot password?</a></p>
{% endblock %}
